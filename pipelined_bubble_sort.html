<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מיון בועות בצנרת – Pipelined Bubble Sort</title>
<style>
  :root { --navy:#14213D; --navy2:#24406E; --orange:#E8772E; --bg:#EEF2F8; --muted:#6B7280; --green:#2E7D5B; --paleG:#E3F2EA; --paleO:#FDEBDD; --line:#C9CFD8; }
  * { box-sizing:border-box; }
  body { font-family:'Assistant','Segoe UI',Arial,sans-serif; background:var(--bg); color:#1F2937; margin:0; padding:18px; }
  h1 { color:var(--navy); margin:0 0 4px; font-size:28px; text-align:center; }
  .sub { text-align:center; color:var(--muted); margin-bottom:12px; font-size:16px; }
  .en { direction:ltr; unicode-bidi:isolate; }
  .top { display:flex; justify-content:center; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .top button { background:#dfe5f0; color:var(--navy); }
  .top button.on { background:var(--navy); color:#fff; }
  .card { background:#fff; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.06); padding:16px; max-width:1080px; margin:0 auto 12px; }
  .stepTitle { text-align:center; font-size:20px; font-weight:bold; color:var(--navy); margin-bottom:6px; }
  .arr { position:relative; display:flex; gap:12px; justify-content:center; direction:ltr; padding:46px 0 8px; }
  .cell { width:62px; text-align:center; position:relative; }
  .val { height:56px; display:flex; align-items:center; justify-content:center; border:3px solid var(--line); border-radius:8px;
         font-size:24px; font-weight:bold; background:#fff; transition:all .25s; }
  .val.final { background:var(--paleG); border-color:var(--green); color:var(--green); }
  .val.swapped { animation:pop .45s; }
  @keyframes pop { 50% { transform:scale(1.15); } }
  .idx { font-size:13px; color:var(--muted); margin-top:4px; }
  .pair { position:absolute; top:8px; height:30px; border-radius:8px 8px 0 0; border:3px solid; border-bottom:none;
          color:#fff; font-size:13px; font-weight:bold; display:flex; align-items:flex-start; justify-content:center; padding-top:2px; }
  .pair span { padding:0 8px; border-radius:10px; margin-top:-14px; }
  .desc { max-width:1080px; margin:0 auto 10px; background:#fff; border-right:5px solid var(--orange); padding:12px 16px; border-radius:8px;
          font-size:17px; min-height:58px; line-height:1.55; }
  .desc.ok { border-right-color:var(--green); background:var(--paleG); }
  .controls { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  button { font-family:inherit; font-size:15px; font-weight:bold; padding:8px 16px; border:none; border-radius:6px; background:var(--navy); color:#fff; cursor:pointer; }
  button:disabled { background:#b9c0cc; cursor:not-allowed; }
  .run { background:var(--orange); }
  .stats { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .stat { background:#fff; border-radius:8px; padding:8px 14px; text-align:center; min-width:170px; }
  .stat b { display:block; font-size:22px; color:var(--navy); }
  .stat small { color:var(--muted); font-size:14px; }
  .grid { overflow-x:auto; }
  table { border-collapse:collapse; margin:0 auto; direction:ltr; font-size:14px; }
  th, td { border:1px solid #dde2ea; padding:0; text-align:center; width:74px; height:30px; }
  th { background:var(--navy); color:#fff; font-weight:bold; padding:4px; }
  td.t { background:#f4f6fa; color:var(--muted); font-weight:bold; width:46px; }
  td.ph { color:#fff; font-weight:bold; }
  tr.now td { outline:2px solid var(--orange); outline-offset:-2px; }
  tr.future td.ph { opacity:.12; }
  .legend { text-align:center; color:var(--muted); font-size:14px; margin-top:8px; }
</style>
</head>
<body>
<h1>מיון בועות בצנרת</h1>
<div class="sub"><span class="en">Pipelined Bubble Sort</span> – מעבר חדש מתחיל שני צעדים אחרי הקודם, וכמה מעברים רצים במקביל</div>

<div class="top">
  <button id="in-book" class="on" onclick="setInput('book')">הדוגמה מהספר</button>
  <button id="in-rev" onclick="setInput('rev')">מערך הפוך</button>
  <button id="in-rand" onclick="setInput('rand')">מערך אקראי</button>
</div>

<div class="card">
  <div class="stepTitle" id="stepTitle"></div>
  <div class="arr" id="arr"></div>
</div>
<div class="desc" id="desc"></div>
<div class="controls">
  <button onclick="reset()">איפוס</button>
  <button id="prev" onclick="prev()">צעד אחורה</button>
  <button id="next" onclick="next()">צעד קדימה</button>
  <button id="auto" class="run" onclick="toggleAuto()">הרצה אוטומטית</button>
</div>
<div class="stats">
  <div class="stat"><b id="sPipe"></b><small>צעדי זמן בצנרת</small></div>
  <div class="stat"><b id="sSeq"></b><small>צעדי זמן בגרסה הסדרתית</small></div>
  <div class="stat"><b id="sCmp"></b><small>השוואות שבוצעו עד עכשיו</small></div>
</div>
<div class="card">
  <div class="stepTitle" style="font-size:17px">טבלת הזמנים: איזה מעבר עובד על איזה זוג בכל צעד</div>
  <div class="grid"><table id="grid"></table></div>
  <div class="legend">שורה = צעד זמן · עמודה = זוג המקומות שמושווים · הצבע = המעבר</div>
</div>

<script>
const N = 8;
const COLORS = ['#14213D', '#E8772E', '#2E7D5B', '#24406E', '#B4532A', '#5B7DB1', '#6B7280'];
const INPUTS = { book: [4, 2, 7, 8, 5, 1, 3, 6], rev: [8, 7, 6, 5, 4, 3, 2, 1] };
let input = 'book', states = [], cur = 0, timer = null;

/* Phase k (1..N-1) compares pair (j, j+1) at time t = j + 2(k-1), for j = 0..N-1-k.
   Pairs that are active at the same time are 2 apart, so they never overlap. */
function build() {
  const a = input === 'rand' ? [...Array(N)].map(() => 1 + Math.floor(Math.random() * 99)) : [...INPUTS[input]];
  const T = 2 * N - 3;                                   // time steps t = 0 .. 2N-4
  states = [{ a: [...a], act: [], final: [], cmp: 0, desc: 'מצב התחלתי. בכל מעבר הערך הגדול ביותר שעוד לא במקומו "מבעבע" ימינה. המעבר הראשון מתחיל בצעד 0.' }];
  let cmp = 0; const final = [];
  for (let t = 0; t < T; t++) {
    const act = [];
    for (let k = 1; k <= N - 1; k++) {
      const j = t - 2 * (k - 1);
      if (j >= 0 && j <= N - 1 - k) act.push({ k, j });
    }
    const parts = [];
    act.forEach(({ k, j }) => {
      const x = a[j], y = a[j + 1], sw = x > y;
      if (sw) { a[j] = y; a[j + 1] = x; }
      cmp++;
      parts.push(`מעבר ${k} משווה את המקומות ${j} ו-${j + 1}: ${x} ו-${y}` + (sw ? ' – מחליף' : ' – בלי החלפה'));
      if (j === N - 1 - k) final.push(N - k);           // phase k finished: position N-k is fixed
      if (k === N - 1) final.push(0);
    });
    let d = `צעד ${t}: ` + parts.join('. ') + '.';
    if (act.length > 1) d += ` ${act.length} מעברים עובדים בו-זמנית על זוגות שונים.`;
    const starting = act.find(x => x.j === 0 && x.k > 1);
    if (starting) d += ` מעבר ${starting.k} מתחיל עכשיו, שני צעדים אחרי מעבר ${starting.k - 1}, ולכן לא ייתקל בו.`;
    states.push({ a: [...a], act, final: [...final], cmp, t, desc: d });
  }
  const last = states[states.length - 1];
  states.push({ a: [...a], act: [], final: [...Array(N).keys()], cmp: last.cmp, t: T - 1, done: true,
    desc: `המערך ממוין אחרי ${T} צעדי זמן (2n-3). בגרסה הסדרתית אותן ${last.cmp} השוואות מתבצעות אחת אחרי השנייה, כלומר ${N * (N - 1) / 2} צעדים. עם n מעבדים הזמן יורד מ-O(n²) ל-O(n).` });
  cur = 0; buildGrid(T); render();
}

function buildGrid(T) {
  let h = '<tr><th>t</th>' + [...Array(N - 1).keys()].map(j => `<th>${j},${j + 1}</th>`).join('') + '</tr>';
  for (let t = 0; t < T; t++) {
    h += `<tr id="row${t}"><td class="t">t${t}</td>`;
    for (let j = 0; j < N - 1; j++) {
      const k = (t - j) / 2 + 1;
      const ok = Number.isInteger(k) && k >= 1 && j <= N - 1 - k;
      h += ok ? `<td class="ph" style="background:${COLORS[k - 1]}">מעבר ${k}</td>` : '<td></td>';
    }
    h += '</tr>';
  }
  document.getElementById('grid').innerHTML = h;
}

function render() {
  const s = states[cur], prevS = states[Math.max(cur - 1, 0)];
  const arr = document.getElementById('arr');
  arr.innerHTML = s.a.map((v, i) => {
    const sw = cur > 0 && v !== prevS.a[i];
    return `<div class="cell"><div class="val ${s.final.includes(i) ? 'final' : ''} ${sw ? 'swapped' : ''}" id="v${i}">${v}</div><div class="idx">${i}</div></div>`;
  }).join('');
  requestAnimationFrame(() => {
    const box = arr.getBoundingClientRect();
    s.act.forEach(({ k, j }) => {
      const r1 = document.getElementById('v' + j).getBoundingClientRect(), r2 = document.getElementById('v' + (j + 1)).getBoundingClientRect();
      const p = document.createElement('div'); p.className = 'pair';
      p.style.left = (r1.left - box.left + 6) + 'px'; p.style.width = (r2.right - r1.left - 12) + 'px';
      p.style.borderColor = COLORS[k - 1];
      p.innerHTML = `<span style="background:${COLORS[k - 1]}">מעבר ${k}</span>`;
      arr.appendChild(p);
    });
  });
  document.getElementById('stepTitle').textContent = cur === 0 ? 'לפני הצעד הראשון' : (s.done ? 'סיום' : `צעד זמן ${s.t}`);
  const d = document.getElementById('desc'); d.textContent = s.desc; d.className = 'desc' + (s.done ? ' ok' : '');
  const T = 2 * N - 3;
  document.getElementById('sPipe').textContent = T;
  document.getElementById('sSeq').textContent = N * (N - 1) / 2;
  document.getElementById('sCmp').textContent = s.cmp;
  for (let t = 0; t < T; t++) {
    const row = document.getElementById('row' + t);
    row.className = (!s.done && cur > 0 && t === s.t) ? 'now' : ((cur === 0 || t > s.t) && !s.done ? 'future' : '');
  }
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === states.length - 1;
  if (cur === states.length - 1) stopAuto();
}
function next() { if (cur < states.length - 1) { cur++; render(); } }
function prev() { if (cur > 0) { cur--; render(); } }
function reset() { stopAuto(); cur = 0; render(); }
function setInput(k) {
  input = k;
  ['book', 'rev', 'rand'].forEach(x => document.getElementById('in-' + x).className = x === k ? 'on' : '');
  stopAuto(); build();
}
function toggleAuto() {
  if (timer) { stopAuto(); return; }
  if (cur === states.length - 1) cur = 0;
  document.getElementById('auto').textContent = 'עצירה';
  timer = setInterval(next, 1900); render();
}
function stopAuto() { if (timer) clearInterval(timer); timer = null; document.getElementById('auto').textContent = 'הרצה אוטומטית'; }
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') next(); if (e.key === 'ArrowRight') prev(); });
window.addEventListener('resize', render);
build();
</script>
</body>
</html>
