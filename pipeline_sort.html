<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Insertion Sort Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .speed-control {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #f0f3f4;
            padding: 10px 20px;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.3s;
            min-width: 110px;
        }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        #play-btn { background-color: #2ecc71; }
        #play-btn:hover { background-color: #27ae60; }
        #play-btn.playing { background-color: #e74c3c; }
        #play-btn.playing:hover { background-color: #c0392b; }

        input[type="range"] { width: 150px; cursor: pointer; }

        #visualizer {
            height: 250px;
            width: 100%;
            margin-top: 10px;
            overflow-x: auto;
            background: #fff;
            border: 1px solid #ecf0f1;
            border-radius: 8px;
        }

        .status-msg {
            margin-top: 15px;
            font-size: 1.1em;
            min-height: 3em;
            color: #555;
            background: #f9f9f9;
            padding: 15px;
            border-right: 4px solid #3498db;
            text-align: right;
            border-radius: 4px;
            line-height: 1.5;
        }

        /* SVG Styles */
        .proc-circle {
            fill: #ebf5fb;
            stroke: #2980b9;
            stroke-width: 3px;
            transition: fill 0.3s, stroke 0.3s;
        }
        .proc-circle.filled {
            fill: #d4e6f1;
            stroke: #2471a3;
        }
        .proc-text {
            font-weight: bold;
            font-size: 20px;
            fill: #2c3e50;
            pointer-events: none;
        }
        .proc-label {
            font-size: 14px;
            fill: #7f8c8d;
            font-weight: bold;
        }
        .arrow-line {
            stroke: #bdc3c7;
            stroke-width: 2px;
            marker-end: url(#arrowhead);
        }
        .wire-val-circle {
            fill: #fdf2e9;
            stroke: #e67e22;
            stroke-width: 2px;
        }
        .wire-val-text {
            font-weight: bold;
            font-size: 16px;
            fill: #d35400;
            pointer-events: none;
        }
        .queue-text {
            font-size: 18px;
            font-weight: bold;
            fill: #2c3e50;
        }
        .queue-label {
            font-size: 14px;
            fill: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>מיון הכנסה בצנרת (Pipeline Insertion Sort)</h1>
    <div class="subtitle">כל תהליך קולט מספר, שומר את הקטן מבין השניים שברשותו, ומעביר את הגדול הלאה. (מיון מהקטן לגדול)</div>

    <div class="controls">
        <button id="reset-btn">איפוס מלא</button>
        <button id="prev-btn" disabled>צעד אחורה</button>
        <button id="next-btn">צעד הבא</button>
        <button id="play-btn">הרצה (Play)</button>
    </div>

    <div class="speed-control">
        <label for="speed-slider"><strong>מהירות:</strong> לאט</label>
        <input type="range" id="speed-slider" min="1" max="5" value="3" dir="ltr">
        <label for="speed-slider">מהר</label>
    </div>

    <div id="visualizer"></div>
    <div id="status" class="status-msg">טוען...</div>
</div>

<script>
    // --- Simulation Logic ---
    const N = 5;
    // Using shift() to take from the front, so the array is read left-to-right visually.
    const initialQueue = [5, 2, 1, 3, 4];
    let states = [];

    function generateStates() {
        states = [];
        let queue = [...initialQueue];
        let wires = new Array(N).fill(null);
        let nodes = new Array(N).fill(null);

        // State 0: Initial
        states.push({
            cycle: 0,
            queue: [...queue],
            wires: [...wires],
            nodes: [...nodes],
            desc: "מצב התחלתי. 5 תהליכים (P0-P4) ממתינים ריקים. סדרת המספרים מוכנה להיכנס לצנרת."
        });

        let t = 1;
        while(queue.length > 0 || wires.some(w => w !== null)) {
            let next_wires = new Array(N).fill(null);
            let next_nodes = [...nodes];
            let desc_parts = [];

            // Evaluate nodes based on incoming wires
            for(let i = 0; i < N; i++) {
                if(wires[i] !== null) {
                    let val = wires[i];
                    if(nodes[i] === null) {
                        next_nodes[i] = val;
                        desc_parts.push(`P${i} היה ריק ולכן שומר את ${val}.`);
                    } else if(val < nodes[i]) { // Changed to Ascending logic (<)
                        next_wires[i+1] = nodes[i];
                        next_nodes[i] = val;
                        desc_parts.push(`P${i} משווה ${val} מול ${nodes[i]}. כיוון ש-${val} קטן יותר, הוא שומר אותו ומעביר את הגדול (${nodes[i]}) הלאה.`);
                    } else {
                        next_wires[i+1] = val;
                        desc_parts.push(`P${i} משווה ${val} מול ${nodes[i]}. כיוון ש-${val} גדול/שווה, הוא מעביר אותו הלאה.`);
                    }
                }
            }

            // Take next from queue to the first wire
            if(queue.length > 0) {
                let val = queue.shift();
                next_wires[0] = val;
                desc_parts.push(`המספר ${val} נכנס לצינור אל P0.`);
            }

            states.push({
                cycle: t,
                queue: [...queue],
                wires: [...next_wires], // what's in transit for the NEXT cycle
                nodes: [...next_nodes], // what nodes HOLD right now
                desc: `<strong>מחזור ${t}:</strong> ` + desc_parts.join(" ")
            });

            wires = next_wires;
            nodes = next_nodes;
            t++;
        }

        // Final state
        states.push({
            cycle: t,
            queue: [],
            wires: new Array(N).fill(null),
            nodes: [...nodes],
            desc: "<strong>המיון הושלם!</strong> כל המספרים עברו בצנרת וכל תהליך מחזיק כעת את מקומו הממוין בסדר עולה."
        });
    }

    // --- Visualization Logic ---
    let stepIndex = 0;
    let playTimeout = null;
    let isPlaying = false;
    const speedMap = { 1: 2500, 2: 1800, 3: 1200, 4: 700, 5: 300 };

    const svgWidth = 900;
    const svgHeight = 250;
    const nodeRadius = 30;
    const startX = 200;
    const spacing = 130;

    const svg = d3.select("#visualizer")
        .append("svg")
        .attr("width", svgWidth)
        .attr("height", svgHeight);

    // Arrowhead marker definition
    svg.append("defs").append("marker")
        .attr("id", "arrowhead")
        .attr("viewBox", "-0 -5 10 10")
        .attr("refX", 8)
        .attr("refY", 0)
        .attr("orient", "auto")
        .attr("markerWidth", 6)
        .attr("markerHeight", 6)
        .append("svg:path")
        .attr("d", "M 0,-5 L 10 ,0 L 0,5")
        .attr("fill", "#bdc3c7");

    // Draw static elements (arrows and node outlines)
    for(let i=0; i<N; i++) {
        let cx = startX + i * spacing;
        let cy = 125;

        // Arrow to this node
        let lineStartX = (i === 0) ? 90 : (startX + (i-1) * spacing + nodeRadius);
        svg.append("line")
            .attr("class", "arrow-line")
            .attr("x1", lineStartX)
            .attr("y1", cy)
            .attr("x2", cx - nodeRadius - 5)
            .attr("y2", cy);

        // Arrow out of last node (optional, to show it leaves or terminates)
        if(i === N-1) {
            svg.append("line")
                .attr("class", "arrow-line")
                .attr("x1", cx + nodeRadius)
                .attr("y1", cy)
                .attr("x2", cx + nodeRadius + 40)
                .attr("y2", cy);
        }

        // Process Label (P0, P1...)
        svg.append("text")
            .attr("class", "proc-label")
            .attr("x", cx)
            .attr("y", cy - nodeRadius - 15)
            .attr("text-anchor", "middle")
            .text(`P${i}`);
    }

    // Dynamic containers
    const queueGroup = svg.append("g");
    const nodesGroup = svg.append("g");
    const wiresGroup = svg.append("g");

    function renderState(state) {
        // Render Queue
        queueGroup.selectAll("*").remove();
        queueGroup.append("text")
            .attr("class", "queue-label")
            .attr("x", 45)
            .attr("y", 100)
            .attr("text-anchor", "middle")
            .text("קלט:");
        queueGroup.append("text")
            .attr("class", "queue-text")
            .attr("x", 45)
            .attr("y", 130)
            .attr("text-anchor", "middle")
            .text(state.queue.length > 0 ? state.queue.join(", ") : "ריק");

        // Render Nodes
        let procSelection = nodesGroup.selectAll("g.proc").data(state.nodes);

        let procEnter = procSelection.enter()
            .append("g")
            .attr("class", "proc")
            .attr("transform", (d, i) => `translate(${startX + i * spacing}, 125)`);

        procEnter.append("circle").attr("class", "proc-circle").attr("r", nodeRadius);
        procEnter.append("text").attr("class", "proc-text").attr("text-anchor", "middle").attr("dy", ".3em");

        let procMerge = procSelection.merge(procEnter);

        procMerge.select("circle")
            .attr("class", d => d !== null ? "proc-circle filled" : "proc-circle");

        procMerge.select("text")
            .text(d => d !== null ? d : "");

        // Render Wires (values in transit) - Fixed D3 Data Join
        let wireData = state.wires.map((val, idx) => ({val: val, idx: idx})).filter(d => d.val !== null);

        // Key elements strictly by index so D3 knows which wire is which
        let wireSelection = wiresGroup.selectAll("g.wire-val").data(wireData, d => d.idx);

        // Remove old elements immediately
        wireSelection.exit().remove();

        // Add new elements
        let wireEnter = wireSelection.enter()
            .append("g")
            .attr("class", "wire-val")
            .attr("transform", d => {
                let x = (d.idx === 0) ? (startX - 65) : (startX + (d.idx-1)*spacing + nodeRadius + 25);
                return `translate(${x}, 125)`;
            });

        wireEnter.append("circle")
            .attr("class", "wire-val-circle")
            .attr("r", 0) // start small for pop effect
            .transition().duration(200)
            .attr("r", 16);

        wireEnter.append("text")
            .attr("class", "wire-val-text")
            .attr("text-anchor", "middle")
            .attr("dy", ".3em");

        // Merge and UPDATE text explicitly on every step
        let wireMerge = wireSelection.merge(wireEnter);
        wireMerge.select("text").text(d => d.val);

        // Update Description
        document.getElementById("status").innerHTML = state.desc;

        // Update Buttons
        document.getElementById("prev-btn").disabled = (stepIndex === 0);
        document.getElementById("next-btn").disabled = (stepIndex === states.length - 1);

        if (stepIndex === states.length - 1 && isPlaying) {
            pause();
        }
    }

    // --- Controls Logic ---
    function init() {
        generateStates();
        pause();
        goToStep(0);
    }

    function goToStep(index) {
        if(index < 0) index = 0;
        if(index >= states.length) index = states.length - 1;
        stepIndex = index;
        renderState(states[stepIndex]);
    }

    function togglePlay() {
        if (isPlaying) pause();
        else play();
    }

    function play() {
        if (stepIndex >= states.length - 1) {
            goToStep(0);
        }
        isPlaying = true;
        let btn = document.getElementById("play-btn");
        btn.innerText = "השהה (Pause)";
        btn.classList.add("playing");
        executePlayLoop();
    }

    function executePlayLoop() {
        if (!isPlaying) return;
        if (stepIndex < states.length - 1) {
            goToStep(stepIndex + 1);
            let intervalTime = speedMap[document.getElementById("speed-slider").value];
            playTimeout = setTimeout(executePlayLoop, intervalTime);
        } else {
            pause();
        }
    }

    function pause() {
        isPlaying = false;
        clearTimeout(playTimeout);
        let btn = document.getElementById("play-btn");
        btn.innerText = "הרצה (Play)";
        btn.classList.remove("playing");
    }

    document.getElementById("reset-btn").addEventListener("click", init);
    document.getElementById("next-btn").addEventListener("click", () => { pause(); goToStep(stepIndex + 1); });
    document.getElementById("prev-btn").addEventListener("click", () => { pause(); goToStep(stepIndex - 1); });
    document.getElementById("play-btn").addEventListener("click", togglePlay);

    document.getElementById("speed-slider").addEventListener("input", () => {
        if (isPlaying) {
            clearTimeout(playTimeout);
            executePlayLoop();
        }
    });

    // Start
    init();
</script>

</body>
</html>
